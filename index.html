<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IET DAVV Engineering College - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: #c5c5c6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: #ffffff;
            width: 420px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 5px;
            color: #1a4d8f;
            font-size: 26px;
        }

        .login-box p {
            color: #7a8a99;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-box {
            width: 100%;
            margin-bottom: 15px;
        }

        .input-box input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            outline: none;
            background: #eaf2fb;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: #0b3d91;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #092f70;
        }

        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #7a7a7a;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>IET DAVV Engineering College</h1>
        <p>Student Login – Use your official college email ID</p>

        <div class="input-box">
            <input type="email" placeholder="student1@xyzcollege.edu">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password">
        </div>

        <button class="login-btn" onclick="location.href='home.html'">
          Login
        </button>


        <div class="note">
            Only IET DAVV Engineering College students are allowed
        </div>
    </div>

</body>
</html>
